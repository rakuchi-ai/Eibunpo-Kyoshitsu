<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文法全問マスター（全690問）</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            width: 100%;
            max-width: 720px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            text-align: center;
            display: inline-block;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            background-color: var(--card-border);
        }

        .btn-warning {
            background-color: var(--warning);
            color: #000;
        }

        .btn-warning:hover {
            filter: brightness(0.9);
        }

        /* Home Screen */
        .mode-selection {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }

        .card-option {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 18px;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .card-option:hover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.05);
        }

        .card-option h3 {
            font-size: 1.1rem;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .card-option p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background-color: #0f172a;
            color: white;
            border: 1px solid var(--card-border);
            font-size: 1rem;
            margin-top: 8px;
        }

        /* Quiz Screen */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .progress-bar {
            height: 6px;
            background: var(--card-border);
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-tag {
            display: inline-block;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            padding: 14px 18px;
            border-radius: 10px;
            color: var(--text-primary);
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: #475569;
        }

        .option-btn.selected {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
        }

        .option-btn.correct {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
        }

        .option-btn.incorrect {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }

        .option-label {
            font-weight: bold;
            margin-right: 12px;
            color: var(--text-secondary);
            width: 24px;
        }

        .explanation-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
            display: none;
        }

        .explanation-box.active {
            display: block;
        }

        .explanation-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--success);
            margin-bottom: 6px;
        }

        .explanation-title.wrong {
            color: var(--danger);
        }

        .explanation-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #e2e8f0;
        }

        .action-bar {
            display: flex;
            gap: 12px;
        }

        .bookmark-btn {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 16px;
            transition: all 0.2s;
        }

        .bookmark-btn.active {
            border-color: var(--warning);
            color: var(--warning);
            background: rgba(245, 158, 11, 0.1);
        }

        /* Result Screen */
        .result-stats {
            text-align: center;
            padding: 24px 0;
        }

        .score-circle {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .stock-badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>英文法 全問マスター</h1>
        <p class="subtitle">全690問・完全収録</p>
    </header>

    <div class="container">
        <!-- ホーム画面 -->
        <div id="home-screen" class="screen active">
            <h2 style="font-size: 1.2rem; margin-bottom: 16px;">学習モードを選択</h2>
            <div class="mode-selection">
                <div class="card-option" onclick="selectMode('category')">
                    <h3>分野別学習</h3>
                    <p>特定の文法分野（不定詞、関係詞など）を選んで集中回答します。</p>
                    <div id="category-select-wrapper" style="display:none; margin-top: 12px;" onclick="event.stopPropagation()">
                        <select id="category-select">
                            <!-- JSで生成 -->
                        </select>
                        <button class="btn" style="margin-top: 10px;" onclick="startCategoryQuiz()">この分野でスタート</button>
                    </div>
                </div>

                <div class="card-option" onclick="selectMode('random')">
                    <h3>全分野ランダムテスト</h3>
                    <p>全690問からランダムに出題します。問題数を選択してください。</p>
                    <div id="random-select-wrapper" style="display:none; margin-top: 12px;" onclick="event.stopPropagation()">
                        <select id="random-count-select">
                            <option value="10">10 問テスト</option>
                            <option value="20">20 問テスト</option>
                            <option value="50">50 問テスト</option>
                        </select>
                        <button class="btn" style="margin-top: 10px;" onclick="startRandomQuiz()">ランダムテスト開始</button>
                    </div>
                </div>

                <div class="card-option" onclick="startStockQuiz()">
                    <h3>要チェック / 自信なし ストック復習 (<span id="stock-count">0</span>問)</h3>
                    <p>手動でストックした問題、および解き直したい問題を集中的に復習します。</p>
                </div>
            </div>
        </div>

        <!-- クイズ画面 -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <span id="quiz-progress-text">1 / 10 問</span>
                <span id="quiz-category-text">【分野】</span>
            </div>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span id="question-unit-tag" class="question-tag">単元名</span>
                <button id="bookmark-btn" class="bookmark-btn" onclick="toggleBookmark()">
                    ★ 要チェック（自信なし）
                </button>
            </div>

            <div id="question-text" class="question-text">
                <!-- 問題文 -->
            </div>

            <div class="options-grid" id="options-container">
                <!-- 選択肢 -->
            </div>

            <div id="explanation-box" class="explanation-box">
                <div id="explanation-title" class="explanation-title">正解！</div>
                <div id="explanation-text" class="explanation-text">解説テキスト</div>
            </div>

            <div class="action-bar">
                <button id="next-btn" class="btn" style="display: none;" onclick="nextQuestion()">次の問題へ</button>
            </div>
        </div>

        <!-- 結果画面 -->
        <div id="result-screen" class="screen">
            <h2 style="text-align: center; margin-bottom: 12px;">学習完了！</h2>
            <div class="result-stats">
                <div id="score-text" class="score-circle">8 / 10</div>
                <p style="color: var(--text-secondary);" id="score-detail">正解率 80%</p>
                <div id="stock-added-info" class="stock-badge">自信なし・間違えた問題はストックに保存されました</div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
                <button class="btn" onclick="showHomeScreen()">ホームへ戻る</button>
            </div>
        </div>
    </div>

    <script>
        const ALL_QUESTIONS = [
  {
    "id": 1,
    "category": "不定詞",
    "unit": "【不定詞】１　不定詞の名詞的用法",
    "question": "(     ) steep mountains requires a slow pace at first.",
    "options": {
      "A": "To climbing",
      "B": "Climbed",

  {

  {
    "id": 5,

  {

        let currentQuizQuestions = [];
        let currentIndex = 0;
        let userAnswers = [];
        let stockIds = JSON.parse(localStorage.getItem('english_grammar_stock') || '[]');

        // 初期化
        document.addEventListener('DOMContentLoaded', () => {
            initCategorySelect();
            updateStockCount();
        });

        function updateStockCount() {
            document.getElementById('stock-count').innerText = stockIds.length;
        }

        function initCategorySelect() {
            const select = document.getElementById('category-select');
            const categories = [...new Set(ALL_QUESTIONS.map(q => q.category))];
            select.innerHTML = categories.map(c => `<option value="${c}">${c} (${ALL_QUESTIONS.filter(q => q.category === c).length}問)</option>`).join('');
        }

        function selectMode(mode) {
            document.getElementById('category-select-wrapper').style.display = mode === 'category' ? 'block' : 'none';
            document.getElementById('random-select-wrapper').style.display = mode === 'random' ? 'block' : 'none';
        }

        function startCategoryQuiz() {
            const cat = document.getElementById('category-select').value;
            currentQuizQuestions = ALL_QUESTIONS.filter(q => q.category === cat);
            startQuiz();
        }

        function startRandomQuiz() {
            const count = parseInt(document.getElementById('random-count-select').value);
            const shuffled = [...ALL_QUESTIONS].sort(() => Math.random() - 0.5);
            currentQuizQuestions = shuffled.slice(0, count);
            startQuiz();
        }

        function startStockQuiz() {
            if (stockIds.length === 0) {
                alert('現在ストックされている問題はありません。');
                return;
            }
            currentQuizQuestions = ALL_QUESTIONS.filter(q => stockIds.includes(q.id));
            startQuiz();
        }

        function startQuiz() {
            currentIndex = 0;
            userAnswers = [];
            showScreen('quiz-screen');
            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuizQuestions[currentIndex];
            document.getElementById('quiz-progress-text').innerText = `${currentIndex + 1} / ${currentQuizQuestions.length} 問`;
            document.getElementById('quiz-category-text').innerText = q.category;
            document.getElementById('progress-fill').style.width = `${((currentIndex) / currentQuizQuestions.length) * 100}%`;
            
            document.getElementById('question-unit-tag').innerText = `No.${q.id} ${q.unit}`;
            document.getElementById('question-text').innerText = `(${q.id}) ${q.question}`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const keys = ['A', 'B', 'C', 'D'];
            keys.forEach(key => {
                if (q.options[key]) {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.onclick = () => selectOption(key);
                    btn.innerHTML = `<span class="option-label">${key}</span><span>${escapeHtml(q.options[key])}</span>`;
                    optionsContainer.appendChild(btn);
                }
            });

            document.getElementById('explanation-box').className = 'explanation-box';
            document.getElementById('next-btn').style.display = 'none';

            // ブックマークボタンの状態
            const isBookmarked = stockIds.includes(q.id);
            const bmBtn = document.getElementById('bookmark-btn');
            if (isBookmarked) {
                bmBtn.classList.add('active');
            } else {
                bmBtn.classList.remove('active');
            }
        }

        function toggleBookmark() {
            const q = currentQuizQuestions[currentIndex];
            const idx = stockIds.indexOf(q.id);
            if (idx > -1) {
                stockIds.splice(idx, 1);
            } else {
                stockIds.push(q.id);
            }
            localStorage.setItem('english_grammar_stock', JSON.stringify(stockIds));
            updateStockCount();
            
            const bmBtn = document.getElementById('bookmark-btn');
            bmBtn.classList.toggle('active');
        }

        function selectOption(selectedKey) {
            const q = currentQuizQuestions[currentIndex];
            const isCorrect = selectedKey === q.answer;
            
            userAnswers.push({ questionId: q.id, selected: selectedKey, isCorrect });

            const btns = document.querySelectorAll('.option-btn');
            btns.forEach((btn, index) => {
                btn.style.pointerEvents = 'none';
                const key = ['A', 'B', 'C', 'D'][index];
                if (key === q.answer) {
                    btn.classList.add('correct');
                } else if (key === selectedKey) {
                    btn.classList.add('incorrect');
                }
            });

            const expBox = document.getElementById('explanation-box');
            const expTitle = document.getElementById('explanation-title');
            const expText = document.getElementById('explanation-text');

            if (isCorrect) {
                expTitle.className = 'explanation-title';
                expTitle.innerText = `正解！ 【正解: ${q.answer}】`;
            } else {
                expTitle.className = 'explanation-title wrong';
                expTitle.innerText = `不正解... 【正解: ${q.answer}】`;
                // 間違えた問題は自動でストックに追加
                if (!stockIds.includes(q.id)) {
                    stockIds.push(q.id);
                    localStorage.setItem('english_grammar_stock', JSON.stringify(stockIds));
                    updateStockCount();
                }
            }

            expText.innerText = q.explanation;
            expBox.classList.add('active');
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuizQuestions.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            showScreen('result-screen');
            const correctCount = userAnswers.filter(a => a.isCorrect).length;
            const total = userAnswers.length;
            const pct = Math.round((correctCount / total) * 100);

            document.getElementById('score-text').innerText = `${correctCount} / ${total}`;
            document.getElementById('score-detail').innerText = `正解率 ${pct}%`;
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showHomeScreen() {
            selectMode(null);
            showScreen('home-screen');
            updateStockCount();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
