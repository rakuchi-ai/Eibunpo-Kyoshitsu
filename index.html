<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クイズアプリ</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .btn-home {
            background-color: #e0e0e0;
            color: #333;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-home:hover {
            background-color: #d0d0d0;
        }
        h1 {
            font-size: 20px;
            margin: 0;
            color: #2c3e50;
        }
        .question-box {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background-color: #fff;
            border: 2px solid #e2e8f0;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.2s;
        }
        .option-btn:hover {
            border-color: #3182ce;
            background-color: #ebf8ff;
        }
        .hidden {
            display: none;
        }
        .btn-primary {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: #2b6cb0;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- ホーム画面 -->
        <div id="home-screen">
            <h1>クイズアプリへようこそ</h1>
            <p>準備ができたらスタートボタンを押してください。</p>
            <button class="btn-primary" onclick="startQuiz()">演習スタート</button>
        </div>

        <!-- クイズ画面 -->
        <div id="quiz-screen" class="hidden">
            <div class="header-bar">
                <button class="btn-home" onclick="returnHome()">ホームへ戻る</button>
                <span id="progress-indicator" style="font-size: 14px; color: #666;">第1問 / 全3問</span>
            </div>
            <div class="question-box" id="question-text">ここに問題文が表示されます。</div>
            <div class="options-list" id="options-container">
                <!-- 選択肢が動的に入ります -->
            </div>
        </div>

        <!-- 結果画面 -->
        <div id="result-screen" class="hidden">
            <h1>演習終了！</h1>
            <p id="score-text">お疲れ様でした。</p>
            <button class="btn-primary" onclick="returnHome()">ホームに戻る</button>
        </div>
    </div>

    <script>
        // サンプルのクイズデータ
        const quizData = [
            {
                question: "日本の首都はどこですか？",
                options: ["大阪", "東京", "京都", "福岡"],
                answer: 1
            },
            {
                question: "次のうちプログラミング言語はどれ？",
                options: ["HTML", "CSS", "JavaScript", "JPEG"],
                answer: 2
            },
            {
                question: "1年は何ヶ月ある？",
                options: ["10ヶ月", "11ヶ月", "12ヶ月", "13ヶ月"],
                answer: 2
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const q = quizData[currentQuestionIndex];
            document.getElementById('progress-indicator').innerText = `第${currentQuestionIndex + 1}問 / 全${quizData.length}問`;
            document.getElementById('question-text').innerText = q.question;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option;
                btn.onclick = () => selectAnswer(index);
                container.appendChild(btn);
            });
        }

        function selectAnswer(selectedIndex) {
            const q = quizData[currentQuestionIndex];
            if (selectedIndex === q.answer) {
                score++;
            }
            
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-text').innerText = `正解数: ${score} / ${quizData.length}問`;
        }

        function returnHome() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('home-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
