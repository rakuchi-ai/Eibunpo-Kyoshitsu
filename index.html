<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英文法教室</title>

<!-- Google FontsからUD系フォント（BIZ UDPGothic）を読み込み -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#f3f5f4;--card:#fff;--tx:#1c2523;--mut:#66726f;--bd:#d8dedc;--board:#1f3a34;--chalk:#f2f4ef;--hi:#e8c547;--ok:#23804f;--ng:#c0392b;--sel:#1f3a34;--selx:#f2f4ef;
    --base-font: "UD Digi Kyokasho N-R", "UD Digital Kyokasho NK-R", "BIZ UDPGothic", "メイリオ", Meiryo, sans-serif;
}
@media(prefers-color-scheme:dark){:root{--bg:#121816;--card:#1a2220;--tx:#e6ebe9;--mut:#93a09c;--bd:#2c3835;--board:#0f1f1b;--chalk:#eef1ec;--ok:#46c07f;--ng:#ff7b6e;--sel:#e8c547;--selx:#14201d}}
*{box-sizing:border-box}

/* ページ全体および文字を扱う要素にUDフォントを確実に適用 */
body, button, select, input, textarea, h1, h2, h3, h4, h5, h6 {
    font-family: var(--base-font) !important;
}

body{margin:0;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.7}
header{background:var(--board);color:var(--chalk);padding:18px 16px 14px;border-bottom:5px solid var(--hi)}
header h1{margin:0;font-size:26px;letter-spacing:.12em;font-weight:700}
header p{margin:2px 0 0;font-size:13px;opacity:.8}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px;color:var(--mut);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px}
button,select,input[type=text]{font:inherit;color:inherit}
.opt{flex:1 1 0;min-width:96px;padding:10px 8px;border:1.5px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer}
.opt.on{background:var(--sel);color:var(--selx);border-color:var(--sel);font-weight:700}
.opt small{display:block;font-size:12px;opacity:.75}
select{width:100%;padding:10px;border:1.5px solid var(--bd);border-radius:8px;background:var(--card)}
.go{width:100%;padding:14px;border:0;border-radius:10px;background:var(--board);color:var(--chalk);font-size:18px;font-weight:700;cursor:pointer;border-bottom:4px solid var(--hi)}
.go:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;padding:6px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;color:var(--mut)}
.bar button{padding:6px 12px;border:1.5px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer}
.prog{height:6px;background:var(--bd);border-radius:3px;margin-bottom:14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--hi)}
.unit{font-size:12px;color:var(--mut);margin-bottom:6px}
.q{font-size:20px;line-height:1.9;font-family:Georgia,"Times New Roman","Hiragino Mincho ProN","Yu Mincho",serif;white-space:pre-wrap;word-break:break-word;margin:0 0 14px}
.ch{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border:1.5px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer;font-size:17px}
.ch b{display:inline-block;width:1.6em;color:var(--mut);font-family:var(--base-font)}
.ch.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.ch.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 16%,transparent)}
.ch:disabled{cursor:default;color:inherit}
input[type=text]{width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:8px;background:var(--card);font-size:18px}
.fb{margin-top:14px;padding:12px 14px;border-radius:8px;border-left:6px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.fb.bad{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 10%,transparent)}
.fb h3{margin:0 0 4px;font-size:18px}
.fb p{margin:4px 0}
.ans{font-family:Georgia,serif;font-size:18px;font-weight:700}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{flex:1;padding:12px;border-radius:8px;border:1.5px solid var(--bd);background:var(--card);cursor:pointer}
.acts .next{background:var(--board);color:var(--chalk);border-color:var(--board);font-weight:700}
.acts .st.on{background:var(--hi);color:#2a2200;border-color:var(--hi);font-weight:700}
.big{font-size:44px;font-weight:700;text-align:center;margin:6px 0}
.li{padding:10px 0;border-top:1px solid var(--bd)}
.li:first-child{border-top:0}
.msg{padding:14px;border:1.5px dashed var(--ng);border-radius:8px}
.rec{padding:12px 0;border-top:1px solid var(--bd)}.rec:first-child{border-top:0}.rec h3{margin:0 0 6px;font-size:16px}
.m{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}.m span{width:4em;color:var(--mut)}.m .t{flex:1;height:10px;background:var(--bd);border-radius:5px;overflow:hidden}.m .t i{display:block;height:100%}.m b{width:3.4em;text-align:right}.sub{font-size:12px;color:var(--mut)}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
    .back-portal-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        font-size: 0.85rem;
        font-weight: 500;
        color: #64748b;
        background-color: #f1f5f9;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        text-decoration: none;
        transition: background-color 0.2s, color 0.2s;
    }
    .back-portal-link:hover {
        background-color: #e2e8f0;
        color: #1e293b;
    }
</style>
</head>
<body>
<header><h1 id="ttl">英文法教室</h1><p id="sub"></p></header>
<div style="max-width:720px; margin:0 auto; padding:16px 16px 0;">
<a href="https://rakuchi-ai.github.io/ENGLISH-TOP/" class="back-portal-link">
    &larr; ポータルに戻る
</a>
</div>
<main id="app"></main>
<script>
const CSV_FILE='questions.csv';         // 問題を差し替えるときは、このCSVを入れ替える
let ALL=[], S={scope:'unit',fmt:'4択',unit:'',n:10}, Q=null, WARN=[], FM=['4択','入力'], LSK='quiz_v1';
let st={wrong:[],stock:[],rec:{}};
const loadSt=()=>{try{return Object.assign({wrong:[],stock:[],rec:{}},JSON.parse(localStorage.getItem(LSK)))}catch(e){return{wrong:[],stock:[],rec:{}}}};
const save=()=>{try{localStorage.setItem(LSK,JSON.stringify(st))}catch(e){}};
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim().toLowerCase();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function parseCSV(t){
  t=t.replace(/^\uFEFF/,'');const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==','){r.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.length>1||r[0]!=='')rows.push(r);r=[]}
    else f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}
  const h=rows.shift().map(x=>x.trim());
  return rows.map(x=>{const o={};h.forEach((k,i)=>o[k]=x[i]??'');return o});
}
function setData(text){
  const rows=parseCSV(text).filter(o=>(o['問題']||'').trim());
  const first=k=>{const r=rows.find(o=>(o[k]||'').trim());return r?r[k].trim():''};
  const title=first('アプリ名')||'問題演習';
  WARN=[];ALL=[];const used=new Set();
  rows.forEach((o,i)=>{
    const row=i+2;let no=parseInt(o['No'],10);
    if(!isFinite(no)||used.has(no)){WARN.push(`${row}行目: No が空か重複しています(自動で番号を振りました。記録のため No は固定を推奨)`);no=100000+i}
    const c=['A','B','C','D'].map(k=>(o['選択肢'+k]||'').trim());
    const fmt=(o['形式']||'').trim()||(c[0]?'4択':'入力');
    const a=(o['正解']||'').trim(), A=a.toUpperCase();
    if(fmt=='4択'){
      if(c.filter(Boolean).length<2||!'ABCD'.includes(A)||A.length!=1||!c['ABCD'.indexOf(A)]){WARN.push(`${row}行目(No.${no}): 4択の選択肢か正解(A〜D)が正しくないため除外しました`);return}
    }else if(fmt=='入力'){
      if(!a){WARN.push(`${row}行目(No.${no}): 入力問題の正解が空のため除外しました`);return}
    }else{WARN.push(`${row}行目(No.${no}): 形式は「4択」か「入力」にしてください(除外しました)`);return}
    used.add(no);
    ALL.push({no,q:(o['問題']).replace(/\r\n?/g,'\n').replace(/[ \t]*\n?[ \t]*(【(?:和訳|指示)】)/,'\n$1'),c,a:fmt=='4択'?A:a,ex:o['解説']||'',
      unit:(o['単元']||o['分野']||'').trim()||'その他',fmt,alt:(o['別解']||'').split('|').map(x=>x.trim()).filter(Boolean)});
  });
  LSK=title=='英文法教室'?'eibunpou_kyoushitsu_v1':'quiz_v1_'+title;   // アプリ名ごとに記録を分ける
  st=loadSt();st.wrong.forEach(n=>{if(!st.rec[n])st.rec[n]='x'});
  document.title=title;$('#ttl').textContent=title;$('#sub').textContent=first('サブタイトル');
  FM=['4択','入力'].filter(f=>ALL.some(q=>q.fmt==f));if(!FM.includes(S.fmt))S.fmt=FM[0]||'4択';
  const units=unitsOf(S.fmt);if(!units.includes(S.unit))S.unit=units[0]||'';
  home();
}
const unitsOf=f=>[...new Set(ALL.filter(q=>q.fmt==f).map(q=>q.unit))];
const byNo=n=>ALL.find(q=>q.no===n);

function init(){
  fetch(CSV_FILE,{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(setData).catch(()=>{
    app.innerHTML=`<div class="msg"><b>${esc(CSV_FILE)} を読み込めませんでした。</b><p>index.html と同じフォルダにCSVを置き、GitHub Pagesなどのサーバー経由で開いてください。ファイルを直接開いている場合は、下のボタンからCSVを選べます。</p><input type="file" id="f" accept=".csv"></div>`;
    $('#f').onchange=e=>{const fr=new FileReader();fr.onload=()=>setData(fr.result);fr.readAsText(e.target.files[0],'utf-8')};
  });
}

/* ---------- ホーム ---------- */
function pool(){
  let p=ALL.filter(q=>q.fmt==S.fmt);
  if(S.scope=='unit')p=p.filter(q=>q.unit==S.unit);
  if(S.scope=='wrong')p=p.filter(q=>st.wrong.includes(q.no));
  if(S.scope=='stock')p=p.filter(q=>st.stock.includes(q.no));
  return p;
}
function home(){
  Q=null;
  const wrongN=ALL.filter(q=>q.fmt==S.fmt&&st.wrong.includes(q.no)).length;
  const stockN=ALL.filter(q=>q.fmt==S.fmt&&st.stock.includes(q.no)).length;
  const p=pool(), cnt=S.scope=='random'?Math.min(S.n,p.length):p.length;
  const o=(on,attr,main,sub)=>`<button class="opt${on?' on':''}" ${attr}>${main}${sub?`<small>${sub}</small>`:''}</button>`;
  app.innerHTML=`${WARN.length?`<details class="msg" style="margin-bottom:14px"><summary>CSVに${WARN.length}件の確認事項があります</summary>${WARN.slice(0,30).map(esc).join('<br>')}</details>`:''}
  <div class="card"><h2>出題範囲</h2><div class="row">
    ${o(S.scope=='unit','data-scope="unit"','単元別')}
    ${o(S.scope=='random','data-scope="random"','ランダム')}
    ${o(S.scope=='wrong','data-scope="wrong"','間違えた問題のみ',wrongN+'問')}
    ${o(S.scope=='stock','data-scope="stock"','ストック問題',stockN+'問')}
  </div></div>
  ${FM.length>1?`<div class="card"><h2>形式</h2><div class="row">${FM.map(f=>o(S.fmt==f,`data-fmt="${f}"`,f)).join('')}</div></div>`:''}
  ${S.scope=='unit'?`<div class="card"><h2>単元(選んだ単元の全問題に挑戦します)</h2><select id="unit">${unitsOf(S.fmt).map(u=>`<option${u==S.unit?' selected':''}>${esc(u)}</option>`).join('')}</div>`:''}
  ${S.scope=='random'?`<div class="card"><h2>問題数</h2><div class="row">${[10,20,50].map(n=>o(S.n==n,`data-n="${n}"`,n+'問')).join('')}</div></div>`:''}
  <button class="go" id="start" ${cnt?'':'disabled'}>${cnt?`演習スタート(${cnt}問)`:(S.scope=='wrong'?'間違えた問題はまだありません':S.scope=='stock'?'ストック問題はまだありません':'問題がありません')}</button>
  <p style="text-align:center"><button class="link" id="rec">あなたの記録</button> <button class="link" id="stock">ストック一覧(${st.stock.length}問)</button></p>`;
  app.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{S.scope=b.dataset.scope;home()});
  app.querySelectorAll('[data-fmt]').forEach(b=>b.onclick=()=>{S.fmt=b.dataset.fmt;const u=unitsOf(S.fmt);if(!u.includes(S.unit))S.unit=u[0]||'';home()});
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{S.n=+b.dataset.n;home()});
  const u=$('#unit');if(u)u.onchange=()=>{S.unit=u.value;home()};
  $('#start').onclick=start;$('#stock').onclick=stockView;$('#rec').onclick=recView;
}

/* ---------- 演習 ---------- */
function start(){
  let p=pool();
  if(S.scope=='random')p=shuffle(p).slice(0,S.n);
  else if(S.scope=='wrong'||S.scope=='stock')p=shuffle(p);
  if(!p.length)return;
  Q={list:p,i:0,ok:0,ng:[],done:false};show();
}
function quit(){if(confirm('演習をやめてホームに戻りますか?\n(ここまでの正誤は保存されます)'))home()}
function show(){
  const q=Q.list[Q.i], total=Q.list.length;
  app.innerHTML=`
  <div class="bar"><span>${Q.i+1} / ${total}問 ・ 正解 ${Q.ok}</span><button id="quit">ホームに戻る</button></div>
  <div class="prog"><i style="width:${Q.i/total*100}%"></i></div>
  <div class="card"><div class="unit">${esc(q.unit)}</div>
  <p class="q">${esc(q.q)}</p>
  <div id="in">${q.fmt=='4択'
    ?q.c.map((t,i)=>t?`<button class="ch" data-k="${'ABCD'[i]}"><b>${'ABCD'[i]}</b>${esc(t)}</button>`:'').join('')
    :`<input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="答えを入力"><div class="acts"><button class="next" id="ok">回答する</button></div>`}
  </div><div id="fb"></div></div>`;
  $('#quit').onclick=quit;
  if(q.fmt=='4択')app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>judge(b.dataset.k));
  else{const a=$('#ans');a.focus();$('#ok').onclick=()=>judge(a.value);a.onkeydown=e=>{if(e.key=='Enter'&&!e.isComposing)judge(a.value)}}
}
function judge(v){
  const q=Q.list[Q.i];if(Q.done)return;
  let ok,ansText;
  if(q.fmt=='4択'){ok=v==q.a;ansText=q.a+'. '+q.c['ABCD'.indexOf(q.a)];}
  else{if(!norm(v))return;ok=[q.a,...q.alt].some(a=>norm(a)==norm(v));ansText=q.a+(q.alt.length?`(別解: ${q.alt.join(' / ')})`:'');}
  Q.done=true;Q.t=Date.now();
  const wasStock=st.stock.includes(q.no), auto=ok&&wasStock;
  st.rec[q.no]=ok?'c':'x';
  if(ok){Q.ok++;st.wrong=st.wrong.filter(n=>n!==q.no);if(wasStock)st.stock=st.stock.filter(n=>n!==q.no)}
  else{Q.ng.push(q);if(!st.wrong.includes(q.no))st.wrong.push(q.no)}
  save();
  const lbl=()=>st.stock.includes(q.no)?'★ ストック済み':(auto?'☆ まだ自信がないのでストックに戻す':'☆ 自信がないのでストック');
  if(q.fmt=='4択')app.querySelectorAll('.ch').forEach(b=>{b.disabled=true;if(b.dataset.k==q.a)b.classList.add('ok');else if(b.dataset.k==v)b.classList.add('ng')});
  else{$('#ans').disabled=true;$('#ok').remove()}
  const last=Q.i==Q.list.length-1;
  $('#fb').innerHTML=`<div class="fb${ok?'':' bad'}"><h3>${ok?'◯ 正解':'✕ 不正解'}</h3>
    <p>正解: <span class="ans">${esc(ansText)}</span></p><p>${esc(q.ex)}</p>${auto?'<p class="sub">ストック問題に正答したので、正答扱いになりストックから外れました。</p>':''}</div>
    <div class="acts"><button class="st${st.stock.includes(q.no)?' on':''}" id="stk">${lbl()}</button>
    <button class="next" id="nx">${last?'結果を見る':'次の問題'}</button></div>`;
  $('#stk').onclick=e=>{toggleStock(q.no);e.target.classList.toggle('on',st.stock.includes(q.no));e.target.textContent=lbl()};
  $('#nx').onclick=()=>{Q.done=false;if(last)result();else{Q.i++;show();scrollTo(0,0)}};
}
// Enterキーで次の問題へ(回答直後のEnterの二重入力は無視する)
document.addEventListener('keydown',e=>{
  if(e.key!='Enter'||e.isComposing||!Q||!Q.done||e.target.tagName=='BUTTON'||Date.now()-Q.t<400)return;
  const n=$('#nx');if(n){e.preventDefault();n.click()}
});
function toggleStock(n){st.stock=st.stock.includes(n)?st.stock.filter(x=>x!==n):[...st.stock,n];save()}
function result(){
  const t=Q.list.length;
  app.innerHTML=`<div class="card"><h2>結果</h2><div class="big">${Q.ok} / ${t}</div>
  <p style="text-align:center;margin:0">正答率 ${Math.round(Q.ok/t*100)}%</p></div>
  ${Q.ng.length?`<div class="card"><h2>間違えた問題(${Q.ng.length}問・「間違えた問題のみ」で復習できます)</h2>${Q.ng.map(q=>`<div class="li"><div class="q" style="font-size:17px;margin:0">${esc(q.q)}</div><div>正解: <span class="ans">${esc(q.a.length==1&&q.fmt=='4択'?q.a+'. '+q.c['ABCD'.indexOf(q.a)]:q.a)}</span></div></div>`).join('')}</div>`:''}
  <button class="go" id="h">ホームに戻る</button>`;
  $('#h').onclick=home;scrollTo(0,0);
}

/* ---------- あなたの記録 ---------- */
function stats(){
  return [...new Set(ALL.map(q=>q.unit))].map(u=>{
    const qs=ALL.filter(q=>q.unit==u);
    return{u,total:qs.length,tried:qs.filter(q=>st.rec[q.no]).length,
      ok:qs.filter(q=>st.rec[q.no]=='c'&&!st.stock.includes(q.no)).length};
  });
}
const pct=(a,b)=>b?Math.round(a/b*100):null;
function meter(label,v,color){
  return `<div class="m"><span>${label}</span><div class="t"><i style="width:${v||0}%;background:${color}"></i></div><b>${v==null?'—':v+'%'}</b></div>`;
}
function recView(){
  const ss=stats(), sum=ss.reduce((a,x)=>({total:a.total+x.total,tried:a.tried+x.tried,ok:a.ok+x.ok}),{total:0,tried:0,ok:0});
  const block=(name,x)=>`<div class="rec"><h3>${esc(name)}</h3>${meter('達成率',pct(x.ok,x.total),'var(--hi)')}${meter('正答率',pct(x.ok,x.tried),'var(--ok)')}
    <div class="sub">正答 ${x.ok}問 / 全${x.total}問 ・ 演習済み ${x.tried}問</div></div>`;
  app.innerHTML=`<div class="bar"><span>あなたの記録</span><button id="b">ホームに戻る</button></div>
  <div class="card">${block('全体',sum)}</div>
  <div class="card"><h2>単元ごとの記録</h2>${ss.map(x=>block(x.u,x)).join('')}</div>
  <div class="card"><h2>達成率・正答率とは</h2>
    <p class="sub" style="margin:0 0 6px"><b>達成率</b> = 単元の全問題(4択・入力の合計)のうち、正答した問題の割合</p>
    <p class="sub" style="margin:0 0 6px"><b>正答率</b> = 演習した問題のうち、正答した問題の割合</p>
    <p class="sub" style="margin:0">・各問題の多様な解答や最新の解答で数えます。<br>・正解でも「自信がないのでストック」した問題は、ストック中は正答に数えません。ストック問題にもう一度正答するとストックから外れ、正答扱いになります。</p></div>
  <p style="text-align:center"><button class="link" id="reset">記録をリセットする</button></p>`;
  $('#b').onclick=home;
  $('#reset').onclick=()=>{if(confirm('正誤の記録(達成率・正答率・間違えた問題)をリセットします。ストックは残ります。よろしいですか?')){st.rec={};st.wrong=[];save();recView()}};
  scrollTo(0,0);
}

/* ---------- ストック ---------- */
function stockView(){
  const items=st.stock.map(byNo).filter(Boolean);
  app.innerHTML=`<div class="bar"><span>自信がない問題ストック(${items.length}問)</span><button id="b">ホームに戻る</button></div>
  <div class="card">${items.length?items.map(q=>`<div class="li"><div class="unit">${esc(q.unit)}(${q.fmt})</div>
    <div class="q" style="font-size:17px;margin:0 0 4px">${esc(q.q)}</div>
    <div>正解: <span class="ans">${esc(q.fmt=='4択'?q.a+'. '+q.c['ABCD'.indexOf(q.a)]:q.a)}</span></div>
    <div style="color:var(--mut);font-size:14px">${esc(q.ex)}</div>
    <button class="link" data-r="${q.no}">ストックから外す</button></div>`).join(''):'<p>ストックはまだありません。演習で「自信がないのでストック」を押すとここに溜まります。</p>'}</div>`;
  $('#b').onclick=home;
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{toggleStock(+b.dataset.r);stockView()});
}
init();
</script>
</body>
