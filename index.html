<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英文法教室</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--tx:#1c2523;--mut:#66726f;--bd:#d8dedc;--board:#1f3a34;--chalk:#f2f4ef;--hi:#e8c547;--ok:#23804f;--ng:#c0392b;--sel:#1f3a34;--selx:#f2f4ef}
@media(prefers-color-scheme:dark){:root{--bg:#121816;--card:#1a2220;--tx:#e6ebe9;--mut:#93a09c;--bd:#2c3835;--board:#0f1f1b;--chalk:#eef1ec;--ok:#46c07f;--ng:#ff7b6e;--sel:#e8c547;--selx:#14201d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 "Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif}
header{background:var(--board);color:var(--chalk);padding:18px 16px 14px;border-bottom:5px solid var(--hi)}
header h1{margin:0;font-size:26px;letter-spacing:.12em;font-weight:700}
header p{margin:2px 0 0;font-size:13px;opacity:.8}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px;color:var(--mut);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;flex-wrap:wrap;gap:8px}
button,select,input[type=text]{font:inherit;color:inherit}
.opt{flex:1 1 0;min-width:96px;padding:10px 8px;border:1.5px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer}
.opt.on{background:var(--sel);color:var(--selx);border-color:var(--sel);font-weight:700}
.opt small{display:block;font-size:12px;opacity:.75}
select{width:100%;padding:10px;border:1.5px solid var(--bd);border-radius:8px;background:var(--card)}
.go{width:100%;padding:14px;border:0;border-radius:10px;background:var(--board);color:var(--chalk);font-size:18px;font-weight:700;cursor:pointer;border-bottom:4px solid var(--hi)}
.go:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;padding:6px 0;font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;color:var(--mut)}
.bar button{padding:6px 12px;border:1.5px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer}
.prog{height:6px;background:var(--bd);border-radius:3px;margin-bottom:14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--hi);transition:width .3s}
.unit{font-size:12px;color:var(--mut);margin-bottom:6px}
.q{font:20px/1.9 Georgia,"Times New Roman","Hiragino Mincho ProN","Yu Mincho",serif;white-space:pre-wrap;word-break:break-word;margin:0 0 14px}
.ch{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border:1.5px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer;font-size:17px}
.ch b{display:inline-block;width:1.6em;color:var(--mut)}
.ch.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.ch.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 16%,transparent)}
.ch:disabled{cursor:default;color:inherit}
input[type=text]{width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:8px;background:var(--card);font-size:18px}
.fb{margin-top:14px;padding:12px 14px;border-radius:8px;border-left:6px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.fb.bad{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 10%,transparent)}
.fb h3{margin:0 0 4px;font-size:18px}
.fb p{margin:4px 0}
.ans{font-family:Georgia,serif;font-size:18px;font-weight:700}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{flex:1;padding:12px;border-radius:8px;border:1.5px solid var(--bd);background:var(--card);cursor:pointer}
.acts .next{background:var(--board);color:var(--chalk);border-color:var(--board);font-weight:700}
.acts .st.on{background:var(--hi);color:#2a2200;border-color:var(--hi);font-weight:700}
.big{font-size:44px;font-weight:700;text-align:center;margin:6px 0}
.li{padding:12px 0;border-top:1px solid var(--bd)}
.li:first-child{border-top:0}
.msg{padding:14px;border:1.5px dashed var(--ng);border-radius:8px}
/* 達成率・正答率バー用 */
.stat-box{margin-top:12px;padding-top:12px;border-top:1px solid var(--bd);font-size:14px}
.stat-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.stat-row:last-child{margin-bottom:0}
.stat-lbl{width:85px;color:var(--mut);font-size:13px}
.stat-bar{flex:1;height:8px;background:var(--bd);border-radius:4px;overflow:hidden}
.stat-bar i{display:block;height:100%;transition:width .3s}
.stat-val{width:105px;text-align:right;font-weight:700;font-size:13px}
.unit-card{cursor:pointer;transition:border-color .2s}
.unit-card:hover{border-color:var(--board)}
.badge-100{background:var(--ok);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
</style>
</head>
<body>
<header><h1>英文法教室</h1><p>4択・入力で英文法を鍛えよう</p></header>
<main id="app"></main>
<script>
const CSV_FILE='questions.csv';          // 問題を差し替えるときは、このCSVを入れ替える
const LS='eibunpou_kyoushitsu_v2';       // 履歴保存用キー
let ALL=[], S={scope:'unit',fmt:'4択',unit:'',n:10}, Q=null;

// solved: 1回でも解いた問題Noの配列, correct: 正解してマスターした問題Noの配列, wrong: 直近間違えた問題No, stock: ストック問題No
let st=(()=>{
  try{
    let d=JSON.parse(localStorage.getItem(LS)) || JSON.parse(localStorage.getItem('eibunpou_kyoushitsu_v1')) || {};
    return Object.assign({wrong:[],stock:[],solved:[],correct:[]},d);
  }catch(e){return{wrong:[],stock:[],solved:[],correct:[]}}
})();
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(st))}catch(e){}};
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim().toLowerCase();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function parseCSV(t){
  t=t.replace(/^﻿/,'');const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==','){r.push(f);f=''}
    else if(c=='
'||c==''){if(c==''&&t[i+1]=='
')i++;r.push(f);f='';if(r.length>1||r[0]!=='')rows.push(r);r=[]}
    else f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}
  const h=rows.shift().map(x=>x.trim());
  return rows.map(x=>{const o={};h.forEach((k,i)=>o[k]=x[i]??'');return o});
}
function setData(text){
  ALL=parseCSV(text).filter(o=>o['問題']).map(o=>({
    no:+o['No'],q:o['問題'],c:['A','B','C','D'].map(k=>o['選択肢'+k]),a:o['正解'],ex:o['解説'],
    unit:o['単元']||o['分野']||'その他',fmt:o['形式']||(o['選択肢A']?'4択':'入力'),alt:(o['別解']||'').split('|').filter(Boolean)}));
  const units=unitsOf(S.fmt);if(!units.includes(S.unit))S.unit=units[0]||'';
  home();
}
const unitsOf=f=>[...new Set(ALL.filter(q=>q.fmt==f).map(q=>q.unit))];
const byNo=n=>ALL.find(q=>q.no===n);

// 単元ごとの成績計算（達成率・正答率）
function getUnitStats(fmt, unit){
  const qs = ALL.filter(q => q.fmt == fmt && q.unit == unit);
  const total = qs.length;
  if(!total) return {total:0, solvedCnt:0, solvedPct:0, correctCnt:0, correctPct:0};
  // 達成数: solvedに含まれている、または既にcorrect/wrong/stockに記録があるもの
  const solvedCnt = qs.filter(q => st.solved.includes(q.no) || st.correct.includes(q.no) || st.wrong.includes(q.no) || st.stock.includes(q.no)).length;
  // マスター(正答)数: 正解済み(correct)であり、かつ「自信がないストック(stock)」に残っていないもの
  const correctCnt = qs.filter(q => st.correct.includes(q.no) && !st.stock.includes(q.no)).length;
  return {
    total,
    solvedCnt,
    solvedPct: Math.round(solvedCnt / total * 100),
    correctCnt,
    correctPct: Math.round(correctCnt / total * 100)
  };
}

function renderStatBars(stat){
  return `<div class="stat-box">
    <div class="stat-row">
      <span class="stat-lbl">達成率(解答済)</span>
      <div class="stat-bar"><i style="width:${stat.solvedPct}%;background:var(--hi)"></i></div>
      <span class="stat-val">${stat.solvedPct}% (${stat.solvedCnt}/${stat.total})</span>
    </div>
    <div class="stat-row">
      <span class="stat-lbl">正答率(習得済)</span>
      <div class="stat-bar"><i style="width:${stat.correctPct}%;background:var(--ok)"></i></div>
      <span class="stat-val">${stat.correctPct}% (${stat.correctCnt}/${stat.total})</span>
    </div>
  </div>`;
}

function init(){
  fetch(CSV_FILE,{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(setData).catch(()=>{
    app.innerHTML=`<div class="msg"><b>${esc(CSV_FILE)} を読み込めませんでした。</b><p>index.html と同じフォルダにCSVを置き、GitHub Pagesなどのサーバー経由で開いてください。ファイルを直接開いている場合は、下のボタンからCSVを選べます。</p><input type="file" id="f" accept=".csv"></div>`;
    $('#f').onchange=e=>{const fr=new FileReader();fr.onload=()=>setData(fr.result);fr.readAsText(e.target.files[0],'utf-8')};
  });
}

/* ---------- ホーム ---------- */
function pool(){
  let p=ALL.filter(q=>q.fmt==S.fmt);
  if(S.scope=='unit')p=p.filter(q=>q.unit==S.unit);
  if(S.scope=='wrong')p=p.filter(q=>st.wrong.includes(q.no));
  return p;
}
function home(){
  Q=null;
  const wrongN=ALL.filter(q=>q.fmt==S.fmt&&st.wrong.includes(q.no)).length;
  const p=pool(), cnt=S.scope=='random'?Math.min(S.n,p.length):p.length;
  const o=(on,attr,main,sub)=>`<button class="opt${on?' on':''}" ${attr}>${main}${sub?`<small>${sub}</small>`:''}</button>`;
  const curStat = S.scope=='unit' && S.unit ? getUnitStats(S.fmt, S.unit) : null;

  app.innerHTML=`
  <div class="card"><h2>出題範囲</h2><div class="row">
    ${o(S.scope=='unit','data-scope="unit"','単元別')}
    ${o(S.scope=='random','data-scope="random"','ランダム')}
    ${o(S.scope=='wrong','data-scope="wrong"','間違えた問題のみ',wrongN+'問')}
  </div></div>
  <div class="card"><h2>形式</h2><div class="row">
    ${o(S.fmt=='4択','data-fmt="4択"','4択')}${o(S.fmt=='入力','data-fmt="入力"','入力')}
  </div></div>
  ${S.scope=='unit'?`<div class="card">
    <h2><span>単元 (全問題に挑戦)</span><button class="link" id="all-stats" style="padding:0">全単元の達成率一覧 ＞</button></h2>
    <select id="unit">${unitsOf(S.fmt).map(u=>{
      const uStat = getUnitStats(S.fmt, u);
      return `<option value="${esc(u)}"${u==S.unit?' selected':''}>${esc(u)} [達成${uStat.solvedPct}% / 正答${uStat.correctPct}%]</option>`;
    }).join('')}</select>
    ${curStat ? renderStatBars(curStat) : ''}
  </div>`:''}
  ${S.scope=='random'?`<div class="card"><h2>問題数</h2><div class="row">${[10,20,50].map(n=>o(S.n==n,`data-n="${n}"`,n+'問')).join('')}</div></div>`:''}
  <button class="go" id="start" ${cnt?'':'disabled'}>${cnt?`演習スタート(${cnt}問)`:(S.scope=='wrong'?'間違えた問題はまだありません':'問題がありません')}</button>
  <div style="display:flex;justify-content:center;gap:20px;margin-top:8px">
    <button class="link" id="stock">自信がない問題ストック(${st.stock.length}問)</button>
    <button class="link" id="stats-btn">単元別の達成率・正答率</button>
  </div>`;

  app.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{S.scope=b.dataset.scope;home()});
  app.querySelectorAll('[data-fmt]').forEach(b=>b.onclick=()=>{S.fmt=b.dataset.fmt;const u=unitsOf(S.fmt);if(!u.includes(S.unit))S.unit=u[0]||'';home()});
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{S.n=+b.dataset.n;home()});
  const u=$('#unit');if(u)u.onchange=()=>{S.unit=u.value;home()};
  $('#start').onclick=()=>start();
  $('#stock').onclick=stockView;
  $('#stats-btn').onclick=statsView;
  if($('#all-stats'))$('#all-stats').onclick=statsView;
}

/* ---------- 演習 ---------- */
function start(customList=null, isStockMode=false){
  let p = customList ? customList : pool();
  if(!customList){
    if(S.scope=='random')p=shuffle(p).slice(0,S.n);
    else if(S.scope=='wrong')p=shuffle(p);
  }
  if(!p.length)return;
  Q={list:p,i:0,ok:0,ng:[],done:false,isStockMode};show();
}
function quit(){if(confirm('演習をやめてホームに戻りますか?
(ここまでの正誤は保存されます)'))home()}
function show(){
  const q=Q.list[Q.i], total=Q.list.length;
  app.innerHTML=`
  <div class="bar"><span>${Q.i+1} / ${total}問 ・ 正解 ${Q.ok}</span><button id="quit">ホームに戻る</button></div>
  <div class="prog"><i style="width:${Q.i/total*100}%"></i></div>
  <div class="card"><div class="unit">${esc(q.unit)}${Q.isStockMode?'（ストック復習）':''}</div>
  <p class="q">${esc(q.q)}</p>
  <div id="in">${q.fmt=='4択'
    ?q.c.map((t,i)=>`<button class="ch" data-k="${'ABCD'[i]}"><b>${'ABCD'[i]}</b>${esc(t)}</button>`).join('')
    :`<input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="答えを英語で入力"><div class="acts"><button class="next" id="ok">回答する</button></div>`}
  </div><div id="fb"></div></div>`;
  $('#quit').onclick=quit;
  if(q.fmt=='4択')app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>judge(b.dataset.k));
  else{const a=$('#ans');a.focus();$('#ok').onclick=()=>judge(a.value);a.onkeydown=e=>{if(e.key=='Enter'&&!e.isComposing)judge(a.value)}}
}
function judge(v){
  const q=Q.list[Q.i];if(Q.done)return;
  let ok,ansText;
  if(q.fmt=='4択'){ok=v==q.a;ansText=q.a+'. '+q.c['ABCD'.indexOf(q.a)];}
  else{if(!norm(v))return;ok=[q.a,...q.alt].some(a=>norm(a)==norm(v));ansText=q.a+(q.alt.length?`(別解: ${q.alt.join(' / ')})`:'');}
  Q.done=true;

  // 達成率(solved)の記録
  if(!st.solved.includes(q.no)) st.solved.push(q.no);

  if(ok){
    Q.ok++;
    st.wrong=st.wrong.filter(n=>n!==q.no);
    if(!st.correct.includes(q.no)) st.correct.push(q.no);
    // ストック復習モードで正解した場合は自動でストックから外す（必要に応じて再ストック可能）
    if(Q.isStockMode && st.stock.includes(q.no)){
      st.stock = st.stock.filter(n=>n!==q.no);
    }
  }else{
    Q.ng.push(q);
    if(!st.wrong.includes(q.no)) st.wrong.push(q.no);
    // 間違えた場合は習得済み(correct)から外す
    st.correct = st.correct.filter(n=>n!==q.no);
  }
  save();

  if(q.fmt=='4択')app.querySelectorAll('.ch').forEach(b=>{b.disabled=true;if(b.dataset.k==q.a)b.classList.add('ok');else if(b.dataset.k==v)b.classList.add('ng')});
  else{$('#ans').disabled=true;$('#ok').remove()}
  const last=Q.i==Q.list.length-1;
  const inStock = st.stock.includes(q.no);
  const stockNote = (Q.isStockMode && ok && !inStock) ? '<p style="font-size:13px;color:var(--ok);font-weight:bold">✓ 正解したためストックを消化（解除）しました！</p>' : '';

  $('#fb').innerHTML=`<div class="fb${ok?'':' bad'}"><h3>${ok?'◯ 正解':'✕ 不正解'}</h3>
    <p>正解: <span class="ans">${esc(ansText)}</span></p><p>${esc(q.ex)}</p>${stockNote}</div>
    <div class="acts"><button class="st${inStock?' on':''}" id="stk">${inStock?'★ ストック済み':'☆ 自信がないのでストック'}</button>
    <button class="next" id="nx">${last?'結果を見る':'次の問題'}</button></div>`;
  $('#stk').onclick=e=>{toggleStock(q.no);e.target.classList.toggle('on',st.stock.includes(q.no));e.target.textContent=st.stock.includes(q.no)?'★ ストック済み':'☆ 自信がないのでストック'};
  $('#nx').onclick=()=>{Q.done=false;if(last)result();else{Q.i++;show();scrollTo(0,0)}};
  $('#nx').focus();
}
function toggleStock(n){st.stock=st.stock.includes(n)?st.stock.filter(x=>x!==n):[...st.stock,n];save()}
function result(){
  const t=Q.list.length;
  app.innerHTML=`<div class="card"><h2>結果</h2><div class="big">${Q.ok} / ${t}</div>
  <p style="text-align:center;margin:0">今回の正答率 ${Math.round(Q.ok/t*100)}%</p></div>
  ${Q.ng.length?`<div class="card"><h2>間違えた問題(${Q.ng.length}問・「間違えた問題のみ」で復習できます)</h2>${Q.ng.map(q=>`<div class="li"><div class="q" style="font-size:17px;margin:0">${esc(q.q)}</div><div>正解: <span class="ans">${esc(q.a.length==1&&q.fmt=='4択'?q.a+'. '+q.c['ABCD'.indexOf(q.a)]:q.a)}</span></div></div>`).join('')}</div>`:''}
  <button class="go" id="h">ホームに戻る</button>`;
  $('#h').onclick=home;scrollTo(0,0);
}

/* ---------- 単元別達成率・正答率一覧 ---------- */
function statsView(){
  const units = unitsOf(S.fmt);
  const totalAll = ALL.filter(q=>q.fmt==S.fmt).length;
  const solvedAll = ALL.filter(q=>q.fmt==S.fmt && (st.solved.includes(q.no)||st.correct.includes(q.no)||st.wrong.includes(q.no)||st.stock.includes(q.no))).length;
  const correctAll = ALL.filter(q=>q.fmt==S.fmt && st.correct.includes(q.no) && !st.stock.includes(q.no)).length;
  const overall = {
    total: totalAll,
    solvedCnt: solvedAll,
    solvedPct: totalAll ? Math.round(solvedAll/totalAll*100) : 0,
    correctCnt: correctAll,
    correctPct: totalAll ? Math.round(correctAll/totalAll*100) : 0
  };

  app.innerHTML=`
  <div class="bar"><span>単元別の達成率・正答率 (${esc(S.fmt)})</span><button id="b">ホームに戻る</button></div>
  <div class="card">
    <h2>全体の進捗 (${esc(S.fmt)} 全${totalAll}問)</h2>
    ${renderStatBars(overall)}
    <p style="font-size:12px;color:var(--mut);margin:10px 0 0">※「ストック」に入っている問題は未習得扱いとなります。ストックを消化すると正答率が100%に近づきます。</p>
  </div>
  ${units.map(u=>{
    const stat = getUnitStats(S.fmt, u);
    return `<div class="card unit-card" data-u="${esc(u)}">
      <h2><span>${esc(u)}${stat.correctPct===100?'<span class="badge-100">COMPLETE!</span>':''}</span><span style="font-size:12px;font-weight:normal">演習する ＞</span></h2>
      ${renderStatBars(stat)}
    </div>`;
  }).join('')}`;

  $('#b').onclick=home;
  app.querySelectorAll('.unit-card').forEach(c=>c.onclick=()=>{
    S.scope='unit'; S.unit=c.dataset.u; start();
  });
}

/* ---------- ストック ---------- */
function stockView(){
  const items=st.stock.map(byNo).filter(Boolean);
  app.innerHTML=`<div class="bar"><span>自信がない問題ストック(${items.length}問)</span><button id="b">ホームに戻る</button></div>
  ${items.length?`<div style="margin-bottom:14px"><button class="go" id="start-stock">ストックした問題だけ演習する(${items.length}問)</button></div>`:''}
  <div class="card">${items.length?items.map(q=>`<div class="li"><div class="unit">${esc(q.unit)}(${q.fmt})</div>
    <div class="q" style="font-size:17px;margin:0 0 4px">${esc(q.q)}</div>
    <div>正解: <span class="ans">${esc(q.fmt=='4択'?q.a+'. '+q.c['ABCD'.indexOf(q.a)]:q.a)}</span></div>
    <div style="color:var(--mut);font-size:14px">${esc(q.ex)}</div>
    <button class="link" data-r="${q.no}">ストックから外す（習得済みにする）</button></div>`).join(''):'<p>ストックはまだありません。演習で「自信がないのでストック」を押すとここに溜まります。</p>'}</div>`;
  $('#b').onclick=home;
  if($('#start-stock'))$('#start-stock').onclick=()=>start(shuffle(items), true);
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{toggleStock(+b.dataset.r);stockView()});
}
init();
</script>
</body>
</html>
